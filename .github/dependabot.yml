version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Kept on the 22.x types (the oldest vitest accepts); CI tests on Node 20 catch newer APIs.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # typescript-eslint's type-aware rules support TypeScript < 6.1 for now.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
