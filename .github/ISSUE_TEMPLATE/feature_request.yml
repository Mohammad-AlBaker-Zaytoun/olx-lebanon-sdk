name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case, before any particular solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: checkboxes
    id: responsible
    attributes:
      label: Responsible use
      options:
        - label: This is for managing my own listings, at a human pace, without getting around OLX's protections.
          required: true
